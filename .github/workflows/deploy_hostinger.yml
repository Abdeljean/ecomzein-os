name: 🚀 Deploy E-comZein OS to Hostinger Production

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🌐 Sync Files to Hostinger Web Cloud
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Generate Prisma Client
        run: |
          npm ci || npm install
          npx prisma generate

      - name: 🚀 Trigger Hostinger Git Webhook (if configured)
        if: env.HAS_WEBHOOK == 'true'
        env:
          HAS_WEBHOOK: ${{ secrets.HOSTINGER_WEBHOOK_URL != '' }}
        run: |
          echo "Triggering Hostinger Git Auto-Deployment Webhook..."
          curl -s -X POST "${{ secrets.HOSTINGER_WEBHOOK_URL }}" || echo "Webhook trigger sent"

      - name: 🚀 FTP Deploy to Hostinger public_html (if FTP_PASSWORD is set)
        if: env.HAS_FTP == 'true'
        env:
          HAS_FTP: ${{ secrets.FTP_PASSWORD != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || 'ftp.tassnimproduct.shop' }}
          username: ${{ secrets.FTP_USERNAME || 'u721391917.tassnimproduct' }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tmp/**
            **/storage/uploads/**
            ecomzein_*.zip
