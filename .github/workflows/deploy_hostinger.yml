name: 🚀 Deploy E-comZein OS to Hostinger Production

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🌐 Sync Files to Hostinger Web Cloud
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Generate Prisma Client
        run: |
          npm ci || npm install
          npx prisma generate

      - name: 🚀 Trigger Hostinger Git Webhook (if configured)
        if: env.HAS_WEBHOOK == 'true'
        env:
          HAS_WEBHOOK: ${{ secrets.HOSTINGER_WEBHOOK_URL != '' }}
        run: |
          echo "Triggering Hostinger Git Auto-Deployment Webhook..."
          curl -s -X POST "${{ secrets.HOSTINGER_WEBHOOK_URL }}" || echo "Webhook trigger sent"

      - name: 🚀 Direct FTP Deploy to Hostinger public_html
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER || 'ftp.tassnimproduct.shop' }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME || 'u721391917.tassnimproduct' }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD || 'Jb462920@' }}
        run: |
          node scripts/deploy_hostinger_auto.js
